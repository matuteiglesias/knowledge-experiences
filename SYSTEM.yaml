repository:
  id: repo.knowledge-experiences
  github: matuteiglesias/knowledge-experiences
  lifecycle: active
  role: knowledge experience composition authority

authority:
  owns:
    - collection membership recipes and frozen collection releases
    - experience composition recipes and frozen experience releases
    - renderer capability declarations and adapter handoff semantics
    - reproducibility/provenance of experience builds
  does_not_own:
    - producer domain semantics or producer-owned schemas
    - shared knowledge interoperability contracts
    - evidence truth or evidence-selection policy
    - semantic inspection or inference
    - renderer implementation internals
    - editorial claims, intellectual stance, or automated publication judgment

ecosystem:
  architecture_authority: repo.knowledge-ecosystem-docs
  shared_interop_authority: repo.kb-contracts
  expected_producers:
    - repo.paper-kb
    - repo.lcd-uba-knowledgebase
  expected_capabilities:
    - repo.knowledge-inspect
    - repo.kb-artifacts
  expected_renderers:
    - repo.abstract-scroller
  vertical_experiences:
    - repo.thesis
    - repo.journal

interfaces:
  implemented_v1:
    - knowledge.collection-spec@1
    - knowledge.collection-release@1
    - knowledge.experience-spec@1
    - knowledge.experience-release@1
  source_adapters:
    - jsonl
    - paper-catalog-jsonl
    - paper-review-jsonl
    - lcd-title-slug-index
  renderers:
    - static-navigator
    - abstract-scroller
  proven_handoffs:
    - producer: repo.paper-kb
      contract: paper.catalog-record@1
      renderer: static-navigator
      evidence: pinned cross-repo CI over sanitized producer records
    - producer: repo.paper-kb
      contract: paper.review-record@1
      renderer: repo.abstract-scroller
      evidence: pinned producer/composer/renderer CI over sanitized producer records
    - producer: repo.lcd-uba-knowledgebase
      artifact: run-scoped title_slug_index.json
      renderer: static-navigator
      evidence: pinned cross-repo CI over local contract-check run

census:
  ledger: docs/experience-census.v1.json
  count: 15
  composition_maturity_rule: real-source-only
  v2_candidates:
    - ordered-groups-and-reading-trails
    - multi-source-collections-and-curation-receipts

status:
  phase: v1.5-census-complete
  next_gate: real-use-before-v2
  implementation_policy: evidence-pulled
