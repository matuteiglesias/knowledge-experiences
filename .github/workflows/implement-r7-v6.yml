name: Implement R7 ordered trail v6

on:
  push:
    branches: [real-use/r7-ordered-thesis-trail]
    paths:
      - '.github/workflows/implement-r7-v6.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/r7-ordered-thesis-trail
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove redundant temp copy from one-shot proof generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/r7_apply_once.py'); text=p.read_text()
          old='''        # Preserve relative sibling source layout used by the accepted spec.\n        sibling=td/"economics-of-aggregation-programme/source"; sibling.mkdir(parents=True); shutil.copy2(parent/"source/items.jsonl",sibling/"items.jsonl")\n'''
          if text.count(old)!=1: raise SystemExit(f'proof temp-layout patch count={text.count(old)}')
          p.write_text(text.replace(old,''))
          PY
      - name: Apply R7 against exact producer Trail B
        run: python scripts/r7_apply_once.py
      - name: Validate full repository and persistent proof
        run: |
          make check
          python scripts/prove_ordered_thesis_trail.py --thesis-root /tmp/thesis-r7
      - name: Commit bounded R7 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src contracts tests scripts/prove_ordered_thesis_trail.py experiences/real/economic-complexity-reading-path docs SYSTEM.yaml
          git diff --cached --check
          git commit -m 'R7: preserve producer-curated reading order'
          git push origin HEAD:real-use/r7-ordered-thesis-trail
