name: Repair R7 literal trail resolver v3

on:
  push:
    branches: [real-use/r7-ordered-thesis-trail]
    paths:
      - '.github/workflows/retry-r7-literal-trail-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/r7-ordered-thesis-trail
      - name: Patch literal producer targets with bounded replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/implement-r7-ordered-trail.yml')
          text = p.read_text()

          for old, new in {
              "'lq-misleads'": "'convenient-framework-location-quotient'",
              "'weighted-multi-product-lq'": "'characterization-of-plq'",
              "'designing-plq'": "'probabilistic-location-quotient'",
              "'measurement-robustness'": "'Location-Quotients/empirical-distributions'",
              "'selection-diagnostics'": "'Location-Quotients/conclusion-location-quotients'",
          }.items():
              if old not in text:
                  raise SystemExit(f'missing trail token {old}')
              text = text.replace(old, new)

          def one(old, new):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one {old!r}, got {n}')
              text = text.replace(old, new)

          # Materialization block.
          one('          slugs = [', '          targets = [')
          one("          for slug in slugs:\n              token = f'(./{slug})'", "          for target in targets:\n              token = f'(./{target})'")
          one('          slug_paths = {}\n          for path in sorted((thesis / \'docs\').rglob(\'*.md\')):', "          slug_keys = [target.rsplit('/', 1)[-1] for target in targets]\n          slug_paths = {}\n          for path in sorted((thesis / 'docs').rglob('*.md')):")
          one('              if match and match.group(1) in slugs:\n                  slug = match.group(1)', '              if match and match.group(1) in slug_keys:\n                  slug = match.group(1)')
          one('          missing = [slug for slug in slugs if slug not in slug_paths]', '          missing = [slug for slug in slug_keys if slug not in slug_paths]')
          one('          ordered_paths = [slug_paths[slug] for slug in slugs]', '          ordered_paths = [slug_paths[slug] for slug in slug_keys]')
          one("              'ordered_slugs': slugs,", "              'ordered_link_targets': targets,")

          # Persistent proof block.
          one('          SLUGS = [', '          TARGETS = [')
          one("              positions = [intro.find(f'(./{slug})') for slug in SLUGS]", "              positions = [intro.find(f'(./{target})') for target in TARGETS]")
          one("              mapping = {}\n              for path in sorted((root / 'docs').rglob('*.md')):", "              slug_keys = [target.rsplit('/', 1)[-1] for target in TARGETS]\n              mapping = {}\n              for path in sorted((root / 'docs').rglob('*.md')):")
          one('                  if match and match.group(1) in SLUGS:', '                  if match and match.group(1) in slug_keys:')
          one('              missing = [slug for slug in SLUGS if slug not in mapping]', '              missing = [slug for slug in slug_keys if slug not in mapping]')
          one('              return [mapping[slug] for slug in SLUGS]', '              return [mapping[slug] for slug in slug_keys]')
          one("'ordered_steps':len(SLUGS)", "'ordered_steps':len(TARGETS)")

          # Both resolver blocks must accept frontmatter slugs with or without a leading slash.
          old_regex = "re.search(r'(?m)^slug:\\s*/([^\\s]+)\\s*$', text)"
          if text.count(old_regex) != 2:
              raise SystemExit(f'expected two slug regexes, got {text.count(old_regex)}')
          text = text.replace(old_regex, "re.search(r'(?m)^slug:\\s*/?([^\\s]+)\\s*$', text)")

          p.write_text(text)
          PY
      - name: Commit patch
        run: |
          rm -f .github/workflows/retry-r7-literal-trail.yml .github/workflows/retry-r7-literal-trail-v2.yml .github/workflows/retry-r7-literal-trail-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'R7: resolve literal Trail B targets'
          git push origin HEAD:real-use/r7-ordered-thesis-trail
