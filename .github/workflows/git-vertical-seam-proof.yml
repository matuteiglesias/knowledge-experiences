name: Git vertical real-source seam proof

on:
  pull_request:
    paths:
      - 'scripts/materialize_markdown_collection.py'
      - 'scripts/prove_git_vertical_seams.py'
      - 'experiences/real/economics-of-aggregation-programme/**'
      - 'experiences/real/working-memory-journal/**'
      - 'experiences/real/ldd-uba-exercise-catalog/**'
      - '.github/workflows/git-vertical-seam-proof.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/materialize_markdown_collection.py'
      - 'scripts/prove_git_vertical_seams.py'
      - 'experiences/real/economics-of-aggregation-programme/**'
      - 'experiences/real/working-memory-journal/**'
      - 'experiences/real/ldd-uba-exercise-catalog/**'
      - '.github/workflows/git-vertical-seam-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Knowledge Experiences
        run: python -m pip install --no-deps -e .
      - name: Checkout exact public producer commits
        run: |
          git clone -q https://github.com/matuteiglesias/thesis.git /tmp/thesis
          git -C /tmp/thesis checkout -q 7265018750db0f96b69efd4048aedad06ad803fc
          test "$(git -C /tmp/thesis rev-parse HEAD)" = "7265018750db0f96b69efd4048aedad06ad803fc"

          git clone -q https://github.com/matuteiglesias/journal.git /tmp/journal
          git -C /tmp/journal checkout -q 11fc6ea42e13866cd952e4957c26dd2e55ef78d7
          test "$(git -C /tmp/journal rev-parse HEAD)" = "11fc6ea42e13866cd952e4957c26dd2e55ef78d7"

          git clone -q https://github.com/matuteiglesias/ldd-uba.git /tmp/ldd-uba
          git -C /tmp/ldd-uba checkout -q 1e8a3c400e1296055614e0dec627f7177c730537
          test "$(git -C /tmp/ldd-uba rev-parse HEAD)" = "1e8a3c400e1296055614e0dec627f7177c730537"
      - name: Reproduce accepted source-to-experience seams
        run: |
          python scripts/prove_git_vertical_seams.py \
            --thesis-root /tmp/thesis \
            --journal-root /tmp/journal \
            --ldd-root /tmp/ldd-uba
