name: Implement R7 ordered trail v4

on:
  push:
    branches: [real-use/r7-ordered-thesis-trail]
    paths:
      - '.github/workflows/implement-r7-v4.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      THESIS_COMMIT: 7265018750db0f96b69efd4048aedad06ad803fc
      TRAIL_ROOT: experiences/real/economic-complexity-reading-path
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/r7-ordered-thesis-trail
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Implement minimal ordered selection and curated navigation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def patch(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1: raise SystemExit(f'{path}: patch target count={text.count(old)}')
              p.write_text(text.replace(old,new))

          patch('src/knowledge_experiences/models.py',
                '        if mode not in {"all", "ids", "facets"}:\n            raise ValidationError("selection.mode must be \'all\', \'ids\', or \'facets\'")',
                '        if mode not in {"all", "ids", "ordered_ids", "facets"}:\n            raise ValidationError("selection.mode must be \'all\', \'ids\', \'ordered_ids\', or \'facets\'")')
          patch('src/knowledge_experiences/models.py',
                '        if mode == "ids" and not ids:\n            raise ValidationError("selection.item_ids must be non-empty when mode=\'ids\'")\n        if mode != "ids" and ids:\n            raise ValidationError("selection.item_ids is only valid when mode=\'ids\'")',
                '        if mode in {"ids", "ordered_ids"} and not ids:\n            raise ValidationError("selection.item_ids must be non-empty when mode is \'ids\' or \'ordered_ids\'")\n        if mode not in {"ids", "ordered_ids"} and ids:\n            raise ValidationError("selection.item_ids is only valid when mode is \'ids\' or \'ordered_ids\'")')
          patch('src/knowledge_experiences/models.py',
                '        if self.mode == "ids":\n            out["item_ids"] = list(self.item_ids)',
                '        if self.mode in {"ids", "ordered_ids"}:\n            out["item_ids"] = list(self.item_ids)')
          patch('src/knowledge_experiences/models.py',
                '        if default_sort not in {"title", "date", "source"}:\n            raise ValidationError("navigation.default_sort must be title, date, or source")',
                '        if default_sort not in {"title", "date", "source", "curated"}:\n            raise ValidationError("navigation.default_sort must be title, date, source, or curated")')

          patch('src/knowledge_experiences/compiler.py',
                '    elif spec.selection.mode == "ids":',
                '    elif spec.selection.mode in {"ids", "ordered_ids"}:')
          patch('src/knowledge_experiences/compiler.py',
                '    return sorted(selected, key=lambda item: item["item_id"])',
                '    if spec.selection.mode == "ordered_ids":\n        return selected\n    return sorted(selected, key=lambda item: item["item_id"])')

          patch('src/knowledge_experiences/renderers.py',
                '<option value="source">Source</option>\n</select>',
                '<option value="source">Source</option>\n<option value="curated">Curated order</option>\n</select>')
          patch('src/knowledge_experiences/renderers.py',
                'function sorted(items){\n  return [...items].sort((a,b)=>{',
                'function sorted(items){\n  if(state.sort==="curated") return [...items];\n  return [...items].sort((a,b)=>{')

          p=Path('contracts/collection.spec.v1.schema.json'); d=json.loads(p.read_text())
          d['properties']['selection']['properties']['mode']['enum']=['all','ids','ordered_ids','facets']; p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('contracts/experience.spec.v1.schema.json'); d=json.loads(p.read_text())
          d['properties']['navigation']['properties']['default_sort']['enum']=['title','date','source','curated']; p.write_text(json.dumps(d,indent=2)+'\n')

          p=Path('tests/test_kernel.py'); text=p.read_text(); marker='    def test_missing_selected_id_fails_closed(self) -> None:\n'
          addition='''    def test_ordered_ids_preserve_declared_sequence(self) -> None:\n        raw = json.loads((FIXTURE / "demo.collection.json").read_text(encoding="utf-8"))\n        raw["selection"] = {"mode": "ordered_ids", "item_ids": ["demo:3", "demo:1"]}\n        with tempfile.TemporaryDirectory() as td:\n            td = Path(td)\n            (td / "items.jsonl").write_bytes((FIXTURE / "items.jsonl").read_bytes())\n            spec = td / "collection.json"; spec.write_text(json.dumps(raw), encoding="utf-8")\n            release = compile_collection(spec)\n            self.assertEqual([x["item_id"] for x in release["items"]], ["demo:3", "demo:1"])\n\n    def test_curated_sort_preserves_release_order(self) -> None:\n        collection=json.loads((FIXTURE / "demo.collection.json").read_text(encoding="utf-8"))\n        collection["selection"]={"mode":"ordered_ids","item_ids":["demo:3","demo:1"]}\n        experience=json.loads((FIXTURE / "demo.experience.json").read_text(encoding="utf-8"))\n        experience["collection_spec"]="collection.json"; experience["navigation"]={"default_sort":"curated"}\n        with tempfile.TemporaryDirectory() as td:\n            td=Path(td); (td/"items.jsonl").write_bytes((FIXTURE/"items.jsonl").read_bytes())\n            (td/"collection.json").write_text(json.dumps(collection),encoding="utf-8")\n            (td/"experience.json").write_text(json.dumps(experience),encoding="utf-8")\n            out=td/"release"; build_experience(td/"experience.json",out)\n            release=json.loads((out/"collection.release.json").read_text())\n            self.assertEqual([x["item_id"] for x in release["items"]],["demo:3","demo:1"])\n            html=(out/"site/index.html").read_text(); self.assertIn('"default_sort":"curated"',html)\n            self.assertLess(html.index('demo:3'),html.index('demo:1'))\n\n'''
          if marker not in text: raise SystemExit('test marker missing')
          p.write_text(text.replace(marker,addition+marker))
          PY

      - name: Install patched package and checkout exact producer
        run: |
          python -m pip install --no-deps -e .
          git clone -q https://github.com/matuteiglesias/thesis.git /tmp/thesis
          git -C /tmp/thesis checkout -q "$THESIS_COMMIT"
          test "$(git -C /tmp/thesis rev-parse HEAD)" = "$THESIS_COMMIT"
          python scripts/materialize_markdown_collection.py --repo-root /tmp/thesis --source-repo matuteiglesias/thesis --authority repo.thesis --commit "$THESIS_COMMIT" --scope-root docs --mode all-markdown --collection-id economics-of-aggregation-programme --title 'Economics of Aggregation programme — exact document index' --description 'Metadata-only index of exact versioned research-programme documents; repo.thesis retains content and status authority.' --kind research-document --out-dir /tmp/thesis-full
          cmp /tmp/thesis-full/source/items.jsonl experiences/real/economics-of-aggregation-programme/source/items.jsonl

      - name: Resolve literal producer Trail B and build ordered experience
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path(os.environ['TRAIL_ROOT']); root.mkdir(parents=True,exist_ok=True)
          thesis=Path('/tmp/thesis'); commit=os.environ['THESIS_COMMIT']
          targets=['observations-lq-problem','convenient-framework-location-quotient','characterization-of-plq','probabilistic-location-quotient','Location-Quotients/empirical-distributions','Location-Quotients/conclusion-location-quotients']
          intro=(thesis/'docs/intro.md').read_text()
          pos=[intro.find(f'(./{t})') for t in targets]
          if any(x<0 for x in pos) or pos!=sorted(pos): raise SystemExit('literal Trail B links missing/reordered')
          keys=[t.rsplit('/',1)[-1] for t in targets]; mapping={}
          for path in sorted((thesis/'docs').rglob('*.md')):
              m=re.search(r'(?m)^slug:\s*/?([^\s]+)\s*$',path.read_text(errors='replace'))
              if m and m.group(1) in keys:
                  if m.group(1) in mapping: raise SystemExit(f'duplicate slug {m.group(1)}')
                  mapping[m.group(1)]=path.relative_to(thesis).as_posix()
          missing=[k for k in keys if k not in mapping]
          if missing: raise SystemExit(f'unresolved Trail B targets: {missing}')
          paths=[mapping[k] for k in keys]
          rows=[json.loads(x) for x in Path('/tmp/thesis-full/source/items.jsonl').read_text().splitlines() if x.strip()]
          by_path={r['source_ref']['object_id']:r for r in rows}; missing=[p for p in paths if p not in by_path]
          if missing: raise SystemExit(f'Trail B files missing from accepted 89-doc projection: {missing}')
          ids=[by_path[p]['item_id'] for p in paths]
          collection={'schema_id':'knowledge.collection-spec','schema_version':1,'collection_id':'economic-complexity-reading-path','title':'Economic complexity — location-quotient problem reading path','description':'Six-step producer-curated Trail B from the exact Thesis programme; editorial sequence is collection meaning.','source':{'adapter':'jsonl','path':'../economics-of-aggregation-programme/source/items.jsonl','authority':'repo.thesis','release_id':f'git:{commit}'},'selection':{'mode':'ordered_ids','item_ids':ids}}
          experience={'schema_id':'knowledge.experience-spec','schema_version':1,'experience_id':'economic-complexity-reading-path','title':'Understand the location-quotient problem','collection_spec':'collection.json','renderer':'static-navigator','visibility':'public','capabilities':{'search':True,'facets':[]},'navigation':{'default_sort':'curated'}}
          (root/'collection.json').write_text(json.dumps(collection,indent=2,ensure_ascii=False)+'\n')
          (root/'snapshot.experience.json').write_text(json.dumps(experience,indent=2,ensure_ascii=False)+'\n')
          receipt={'schema_id':'knowledge.curated-trail-source-receipt','schema_version':1,'producer':'repo.thesis','producer_git_commit':commit,'producer_authority_document':'docs/intro.md#Trail-B','trail_label':'Why is a location quotient not on a common scale?','ordered_link_targets':targets,'ordered_source_paths':paths,'ordered_item_ids':ids,'source_projection':'experiences/real/economics-of-aggregation-programme/source/items.jsonl','ordering_semantics':'producer editorial sequence; not alphabetical or item-id sort'}
          (root/'source-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          rm -rf "$TRAIL_ROOT/release"
          kx doctor "$TRAIL_ROOT/snapshot.experience.json"
          kx build "$TRAIL_ROOT/snapshot.experience.json" --out "$TRAIL_ROOT/release"

      - name: Prove order survives and add persistent exact-source proof
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ['TRAIL_ROOT']); receipt=json.loads((r/'source-receipt.json').read_text()); c=json.loads((r/'release/collection.release.json').read_text()); e=json.loads((r/'release/experience.release.json').read_text()); html=r/'release/site/index.html'
          ids=[x['item_id'] for x in c['items']]
          if ids!=receipt['ordered_item_ids']: raise SystemExit('CollectionRelease lost curated order')
          txt=html.read_text(); positions=[txt.find(i) for i in ids]
          if any(p<0 for p in positions) or positions!=sorted(positions): raise SystemExit('HTML payload lost curated order')
          proof={'schema_id':'knowledge.e3-cross-repo-proof','schema_version':1,'proof':'producer-curated-order-to-frozen-experience','source_repo':'matuteiglesias/thesis','source_commit':os.environ['THESIS_COMMIT'],'producer_authority_document':'docs/intro.md#Trail-B','ordered_item_ids':ids,'collection_release_id':c['release_id'],'experience_release_id':e['release_id'],'rendered_artifact_sha256':hashlib.sha256(html.read_bytes()).hexdigest(),'result':'pass'}
          (r/'e3-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,indent=2))
          PY
          cat > scripts/prove_ordered_thesis_trail.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse,hashlib,json,re,shutil,subprocess,tempfile
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]; COMMIT='7265018750db0f96b69efd4048aedad06ad803fc'
          TARGETS=['observations-lq-problem','convenient-framework-location-quotient','characterization-of-plq','probabilistic-location-quotient','Location-Quotients/empirical-distributions','Location-Quotients/conclusion-location-quotients']
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def run(*a): subprocess.run(list(a),check=True)
          def same(a,b,label):
              if sha(a)!=sha(b): raise SystemExit(f'{label}: sha mismatch')
          def resolve(root):
              actual=subprocess.run(['git','-C',str(root),'rev-parse','HEAD'],check=True,text=True,capture_output=True).stdout.strip()
              if actual!=COMMIT: raise SystemExit(f'thesis checkout mismatch {actual}')
              intro=(root/'docs/intro.md').read_text(); pos=[intro.find(f'(./{t})') for t in TARGETS]
              if any(p<0 for p in pos) or pos!=sorted(pos): raise SystemExit('producer Trail B links missing/reordered')
              keys=[t.rsplit('/',1)[-1] for t in TARGETS]; mapping={}
              for path in sorted((root/'docs').rglob('*.md')):
                  m=re.search(r'(?m)^slug:\s*/?([^\s]+)\s*$',path.read_text(errors='replace'))
                  if m and m.group(1) in keys:
                      if m.group(1) in mapping: raise SystemExit(f'duplicate slug {m.group(1)}')
                      mapping[m.group(1)]=path.relative_to(root).as_posix()
              missing=[k for k in keys if k not in mapping]
              if missing: raise SystemExit(f'unresolved trail targets {missing}')
              return [mapping[k] for k in keys]
          def main():
              ap=argparse.ArgumentParser(); ap.add_argument('--thesis-root',required=True); a=ap.parse_args(); source=Path(a.thesis_root).resolve(); paths=resolve(source)
              accepted_full=ROOT/'experiences/real/economics-of-aggregation-programme'; accepted=ROOT/'experiences/real/economic-complexity-reading-path'; receipt=json.loads((accepted/'source-receipt.json').read_text())
              if receipt['ordered_source_paths']!=paths: raise SystemExit('accepted source paths drifted from Trail B')
              with tempfile.TemporaryDirectory(prefix='kx-r7-') as td0:
                  td=Path(td0); full=td/'experiences/real/economics-of-aggregation-programme'
                  run('python',str(ROOT/'scripts/materialize_markdown_collection.py'),'--repo-root',str(source),'--source-repo','matuteiglesias/thesis','--authority','repo.thesis','--commit',COMMIT,'--scope-root','docs','--mode','all-markdown','--collection-id','economics-of-aggregation-programme','--title','Economics of Aggregation programme — exact document index','--description','Metadata-only index of exact versioned research-programme documents; repo.thesis retains content and status authority.','--kind','research-document','--out-dir',str(full))
                  same(full/'source/items.jsonl',accepted_full/'source/items.jsonl','parent projection')
                  trail=td/'experiences/real/economic-complexity-reading-path'; trail.mkdir(parents=True); shutil.copy2(accepted/'collection.json',trail/'collection.json'); shutil.copy2(accepted/'snapshot.experience.json',trail/'snapshot.experience.json')
                  rows=[json.loads(x) for x in (full/'source/items.jsonl').read_text().splitlines() if x.strip()]; by={x['source_ref']['object_id']:x['item_id'] for x in rows}; ids=[by[p] for p in paths]
                  spec=json.loads((trail/'collection.json').read_text())
                  if spec['selection']!={'mode':'ordered_ids','item_ids':ids}: raise SystemExit('ordered selection no longer matches producer trail')
                  run('kx','doctor',str(trail/'snapshot.experience.json')); run('kx','build',str(trail/'snapshot.experience.json'),'--out',str(trail/'release'))
                  same(trail/'release/collection.release.json',accepted/'release/collection.release.json','collection'); same(trail/'release/experience.release.json',accepted/'release/experience.release.json','experience'); same(trail/'release/site/index.html',accepted/'release/site/index.html','html')
              print(json.dumps({'case':'economic-complexity-reading-path','source_commit':COMMIT,'ordered_steps':6,'result':'pass'},indent=2)); return 0
          if __name__=='__main__': raise SystemExit(main())
          PY
          chmod +x scripts/prove_ordered_thesis_trail.py
          python scripts/prove_ordered_thesis_trail.py --thesis-root /tmp/thesis

      - name: Promote census 5 and narrow V2 frontier
        run: |
          python - <<'PY'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('experiences/real/economic-complexity-reading-path'); rec=json.loads((root/'source-receipt.json').read_text()); c=json.loads((root/'release/collection.release.json').read_text()); e=json.loads((root/'release/experience.release.json').read_text()); proof=json.loads((root/'e3-proof.json').read_text())
          p=Path('docs/experience-census.v1.json'); census=json.loads(p.read_text()); row=next(x for x in census['experiences'] if x['id']==5)
          if row['composition_maturity']!='E0': raise SystemExit('census #5 parent maturity changed')
          row.update({'composition_maturity':'E3','engineering_status':'proven_real_source_seam','existing_surface':'repo.thesis producer-curated Trail B in docs/intro.md','source_authorities':['repo.thesis','human-curation'],'code_pins':{'repo.thesis':rec['producer_git_commit']},'exact_source_release':f"git:{rec['producer_git_commit']};authority:docs/intro.md#Trail-B",'collection_release':f"experiences/real/economic-complexity-reading-path/release/collection.release.json#{c['release_id']}",'renderer_profile':'curated-static-navigator','rendered_artifact':'experiences/real/economic-complexity-reading-path/release/site/index.html','cross_repo_proof':'experiences/real/economic-complexity-reading-path/e3-proof.json + scripts/prove_ordered_thesis_trail.py','operational_evidence':None,'capabilities_reused':['git-markdown-metadata-projection','ordered-ids-selection','curated-order-rendering','static-navigator','exact-git-cross-repo-proof'],'incremental_work':'small V2 capability only: ordered_ids plus curated navigation','blocker':'none for this six-step trail; grouping remains absent until a real grouped case requires it','observed_friction':'V1 ids selection and renderer sorting destroyed producer editorial order; real Thesis Trail B made order semantic','v2_candidate':None,'engineering_evidence':['exact producer Trail B has six ordered links','ordered CollectionRelease preserves all six resolved IDs',f"ExperienceRelease {e['release_id']} preserves curated order",f"persistent exact-source proof pins final artifact {proof['rendered_artifact_sha256']}"],'evidence_boundary':'E3 proves the exact six-step Thesis Trail B through ordered selection; no grouping, recurring use, deployment, or E4 operation is claimed','next_real_action':'use/circulate the ordered trail or test a genuinely grouped course source; add groups only if ordered_ids is insufficient'})
          counts=Counter(x['composition_maturity'] for x in census['experiences']); expected=Counter({'E4':1,'E3':5,'E1':1,'E0':9})
          if counts!=expected: raise SystemExit(f'bad R7 distribution {counts}')
          p.write_text(json.dumps(census,indent=2,ensure_ascii=False)+'\n')
          p=Path('SYSTEM.yaml'); text=p.read_text().replace('    E4: 1\n    E3: 4\n    E1: 1\n    E0: 10\n','    E4: 1\n    E3: 5\n    E1: 1\n    E0: 9\n').replace('    - ordered-groups-and-reading-trails\n','    - grouped-reading-semantics-if-real-demand\n').replace('  phase: first-operational-experience\n  next_gate: paper-real-corpus-or-independent-operational-use\n','  phase: first-operational-plus-evidence-pulled-v2\n  next_gate: paper-real-corpus-or-real-grouped-or-multi-source-pressure\n'); p.write_text(text)
          p=Path('docs/EXPERIENCE_CENSUS.md'); text=p.read_text(); text=re.sub(r'\*\*16 governed experiences:[^\n]+\*\*[^\n]*','**16 governed experiences: 1 is E4, 5 are E3, 1 is E1, and 9 remain E0.** R7 promotes the previously blocked economic-complexity reading path after a real producer-curated trail proved sequence is semantic.',text,count=1); text=re.sub(r'\| 5 \| Economic-complexity reading path \| \*\*E0\*\* \| blocked_capability \|[^\n]*',f"| 5 | Economic-complexity reading path | **E3** | proven_real_source_seam | six exact Thesis Trail B steps → `{e['release_id']}` with producer order preserved |",text,count=1); text+='\n## R7 interpretation\n\nThe first V2 capability was earned by a real representational failure. `repo.thesis` already declares Trail B as a six-step editorial sequence; V1 could select the IDs but canonicalized and re-sorted them, erasing the reading path. R7 adds only `ordered_ids` plus `curated` navigation. Grouping remains deliberately absent. No second E4 is claimed without a second independent operational event.\n'; p.write_text(text)
          p=Path('docs/BUILD_BUNDLE.md'); p.write_text(p.read_text()+'\n## R6–R7 frontier extension\n\n- **R6 — first E4:** LCD institutional browsing completed a second governed live refresh, source comparison, deterministic rebuild and downstream validation; its dependent subset remained E3.\n- **R7 — first evidence-pulled V2:** a real six-step Thesis Trail B proved curator order is semantic. KX added only `ordered_ids` selection and `curated` navigation. Group/module semantics remain parked.\n\nCurrent live census after R7: **1×E4 + 5×E3 + 1×E1 + 9×E0**.\n')
          PY

      - name: Validate and commit non-workflow R7 evidence
        run: |
          python -m py_compile scripts/prove_ordered_thesis_trail.py
          make check
          python scripts/prove_ordered_thesis_trail.py --thesis-root /tmp/thesis
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src contracts tests scripts/prove_ordered_thesis_trail.py experiences/real/economic-complexity-reading-path docs SYSTEM.yaml
          git diff --cached --check
          git commit -m 'R7: preserve producer-curated reading order'
          git push origin HEAD:real-use/r7-ordered-thesis-trail
