name: R8 finalize census once

on:
  push:
    branches: [real-use/r8-paper-corpora-fanout]
    paths:
      - '.github/workflows/r8-finalize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile R8 machine census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/experience-census.v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['as_of'] = '2026-08-30'
          rows = {row['id']: row for row in payload['experiences']}
          pin = 'e82e82deb646f30707306cd13ff8ba279c8bad50'

          rows[1].update({
              'composition_maturity': 'E3',
              'engineering_status': 'proven_real_source_seam',
              'existing_surface': 'repo.paper-kb fixture/corpora/tesis-cited catalog projection',
              'code_pins': {'repo.paper-kb': pin},
              'exact_source_release': 'paper-kb@e82e82deb646f30707306cd13ff8ba279c8bad50:fixture/corpora/tesis-cited/catalog/paper.catalog-record.v1.jsonl#sha256:648d8461929629e5b13385510048f77ead7000b98318fdf87d22fe9332f28a1f',
              'collection_release': 'experiences/real/thesis-bibliography/release/collection.release.json#sha256:a766463507d2f5cc',
              'renderer_profile': 'static-navigator',
              'rendered_artifact': 'experiences/real/thesis-bibliography/release/site/index.html',
              'cross_repo_proof': 'experiences/real/thesis-bibliography/e3-proof.json + scripts/prove_real_paper_corpora.py',
              'operational_evidence': None,
              'capabilities_reused': ['paper-catalog-jsonl', 'all-selection', 'author-facet', 'static-navigator', 'deterministic-releases', 'exact-git-cross-repo-proof'],
              'incremental_work': 'configuration and exact-source freezing only; no KX capability change',
              'blocker': 'none for the bounded 19-paper bibliography experience',
              'observed_friction': 'none in KX; the real Paper KB catalog composed with the existing adapter and renderer unchanged',
              'v2_candidate': None,
              'engineering_evidence': [
                  'exact tesis-cited catalog contains 19 real paper records at SHA-256 648d8461929629e5b13385510048f77ead7000b98318fdf87d22fe9332f28a1f',
                  'CollectionRelease sha256:a766463507d2f5cc contains all 19 records',
                  'ExperienceRelease sha256:a6289e933594e505 renders deterministic HTML',
                  'persistent R8 proof rebuilds from exact paper-kb@e82e82deb646f30707306cd13ff8ba279c8bad50 and byte-compares the frozen outputs'
              ],
              'evidence_boundary': 'E3 proves one exact real thesis bibliography fixture through a deterministic human experience; no recurring refresh, deployment or audience use is claimed',
              'next_real_action': 'use or circulate the bibliography, or rebuild after a governed source change; do not add composition capability without observed need'
          })

          rows[3].update({
              'composition_maturity': 'E3',
              'engineering_status': 'proven_real_source_seam',
              'existing_surface': 'repo.paper-kb fixture/corpora/tesis-cited catalog projection',
              'code_pins': {'repo.paper-kb': pin},
              'exact_source_release': 'paper-kb@e82e82deb646f30707306cd13ff8ba279c8bad50:fixture/corpora/tesis-cited/catalog/paper.catalog-record.v1.jsonl#sha256:648d8461929629e5b13385510048f77ead7000b98318fdf87d22fe9332f28a1f',
              'collection_release': 'experiences/real/author-works/release/collection.release.json#sha256:646d6b43072e15b4',
              'renderer_profile': 'static-navigator',
              'rendered_artifact': 'experiences/real/author-works/release/site/index.html',
              'cross_repo_proof': 'experiences/real/author-works/e3-proof.json + scripts/prove_real_paper_corpora.py',
              'operational_evidence': None,
              'capabilities_reused': ['paper-catalog-jsonl', 'facet-selection', 'author-facet', 'static-navigator', 'deterministic-releases', 'exact-git-cross-repo-proof'],
              'incremental_work': 'configuration-only reuse of the producer-owned author facet over the same real 19-paper source',
              'blocker': 'none for the bounded author-works experience',
              'observed_friction': 'none; existing facet selection reduced the real 19-paper source to the two Angus Deaton records without kernel changes',
              'v2_candidate': None,
              'engineering_evidence': [
                  'real tesis-cited producer metadata contains Angus Deaton on exactly two records selected by the existing author facet',
                  'CollectionRelease sha256:646d6b43072e15b4 preserves paper_340915ba55 and paper_7eac0538e3',
                  'ExperienceRelease sha256:799a247b0ed2f161 renders the real author subset',
                  'persistent R8 proof rebuilds and reasserts exact author membership from paper-kb@e82e82deb646f30707306cd13ff8ba279c8bad50'
              ],
              'evidence_boundary': 'E3 proves real author-facet reuse inside the bounded thesis corpus; it does not claim a complete author bibliography, profile system, refresh cycle or public deployment',
              'next_real_action': 'use the bounded author view or test another real author only when useful; do not generalize into an author-profile platform without demand'
          })

          rows[6].update({
              'composition_maturity': 'E3',
              'engineering_status': 'proven_real_source_seam',
              'existing_surface': 'repo.paper-kb fixture/corpora/eric-mv consumer fixture',
              'code_pins': {'repo.paper-kb': pin},
              'exact_source_release': 'paper-kb@e82e82deb646f30707306cd13ff8ba279c8bad50:fixture/corpora/eric-mv/catalog/paper.catalog-record.v1.jsonl#sha256:273a484b873d5ae6f9041b24e3c8b4906d23d0683b26941c95713665353f1b41;consumer-fixture:7-chunk-sets',
              'collection_release': 'experiences/real/fcv-literature-corpus/release/collection.release.json#sha256:010486a65a5888d2',
              'renderer_profile': 'private-static-navigator',
              'rendered_artifact': 'experiences/real/fcv-literature-corpus/release/site/index.html',
              'cross_repo_proof': 'experiences/real/fcv-literature-corpus/e3-proof.json + scripts/prove_real_paper_corpora.py',
              'operational_evidence': None,
              'capabilities_reused': ['paper-catalog-jsonl', 'all-selection', 'author-facet', 'visibility-metadata', 'static-navigator', 'deterministic-releases', 'exact-git-cross-repo-proof'],
              'incremental_work': 'configuration and exact-source freezing only; no richer workbench or KX capability was required',
              'blocker': 'none for the bounded seven-paper FCV seed experience; broader FCV coverage is a corpus-growth question, not a composition blocker',
              'observed_friction': 'none in KX; seven real papers composed with the existing catalog seam while the upstream consumer fixture independently preserves seven canonical chunk sets',
              'v2_candidate': None,
              'engineering_evidence': [
                  'eric-mv consumer fixture at paper-kb@e82e82deb646f30707306cd13ff8ba279c8bad50 records seven source PDFs and seven canonical chunk sets',
                  'exact catalog SHA-256 273a484b873d5ae6f9041b24e3c8b4906d23d0683b26941c95713665353f1b41 contains seven records, all with Eric Mvukiyehe as contributor',
                  'CollectionRelease sha256:010486a65a5888d2 and ExperienceRelease sha256:8a7b561e877d1c82 render the bounded seed corpus',
                  'persistent R8 proof rebuilds the experience from the exact producer pin and byte-compares final artifacts'
              ],
              'evidence_boundary': 'E3 proves a seven-paper FCV seed corpus, not complete FCV literature coverage, recurring operation, deployment or workbench demand',
              'next_real_action': 'use this seed corpus in actual FCV research work and grow it through governed Paper KB corpus updates when concrete literature needs appear'
          })

          for idx in (2, 7):
              row = rows[idx]
              row['engineering_status'] = 'blocked_producer_metadata'
              row['code_pins']['repo.paper-kb'] = pin
              row['blocker'] = 'a real governed review projection is now available, but its current records lack substantive abstract/date/venue metadata needed for the intended review experience'
              row['observed_friction'] = 'real tesis-cited review records preserve identity/title but expose null abstract, date and venue fields; this is producer-metadata pressure rather than a KX composition gap'
              row['engineering_evidence'] = list(dict.fromkeys(row['engineering_evidence'] + ['R8 inspected the real tesis-cited paper.review-record@1 projection: 19 records are governed, but substantive review metadata is currently sparse/null']))
              row['evidence_boundary'] = 'the real producer review surface exists, but R8 deliberately does not promote a title-only review experience; no KX capability is inferred from missing upstream paper metadata'
              row['next_real_action'] = 'improve or preserve authoritative review metadata upstream in Paper KB, then rerun the real review experience before considering any KX capability change'

          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate census
        run: python scripts/check_census.py
      - name: Remove temporary R8 bootstrap machinery
        run: |
          git rm -f .github/workflows/r8-paper-corpora-bootstrap.yml
          git rm -f .github/workflows/r8-finalize-once.yml
      - name: Commit finalized R8 state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experience-census.v1.json
          git commit -m 'R8: promote three real Paper KB experiences to E3 [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
