name: Materialize R4 Git vertical E3 proofs
# One-shot promotion runner; removed after governed R4 evidence is committed.

on:
  push:
    branches: [real-use/r4-git-vertical-e3-proofs]
    paths:
      - '.github/workflows/materialize-r4-git-e3.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/r4-git-vertical-e3-proofs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Knowledge Experiences
        run: python -m pip install --no-deps -e .
      - name: Checkout exact public producer commits
        run: |
          git clone -q https://github.com/matuteiglesias/thesis.git /tmp/thesis
          git -C /tmp/thesis checkout -q 7265018750db0f96b69efd4048aedad06ad803fc
          git clone -q https://github.com/matuteiglesias/journal.git /tmp/journal
          git -C /tmp/journal checkout -q 11fc6ea42e13866cd952e4957c26dd2e55ef78d7
      - name: Prove exact source-to-experience seams and write receipts
        run: |
          python scripts/prove_git_vertical_seams.py \
            --thesis-root /tmp/thesis \
            --journal-root /tmp/journal \
            --write-proofs
      - name: Promote accepted E2 snapshots to E3
        run: python scripts/promote_r4_e3.py
      - name: Validate repository
        run: |
          python -m py_compile scripts/prove_git_vertical_seams.py
          make check
      - name: Remove one-shot promotion machinery
        run: |
          rm .github/workflows/materialize-r4-git-e3.yml
          rm scripts/promote_r4_e3.py
      - name: Commit governed R4 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R4: prove two persistent real-source E3 seams'
          git push origin HEAD:real-use/r4-git-vertical-e3-proofs
