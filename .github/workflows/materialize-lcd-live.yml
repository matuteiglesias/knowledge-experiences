name: Materialize live LCD institutional experience

on:
  push:
    branches: [real-use/lcd-live-institutional]
    paths:
      - '.github/workflows/materialize-lcd-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      LCD_COMMIT: dcaa61e338b284d43764b9c06a0f112629e958f6
      LCD_REPO: https://github.com/matuteiglesias/lcd-UBA-knowledgebase.git
      LIVE_BASE_URL: https://lcd.exactas.uba.ar
      EXPERIENCE_ROOT: experiences/real/lcd-institutional
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/lcd-live-institutional
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Knowledge Experiences
        run: python -m pip install --no-deps -e .
      - name: Checkout pinned LCD producer
        run: |
          git clone -q "$LCD_REPO" /tmp/lcd-kb
          git -C /tmp/lcd-kb checkout -q "$LCD_COMMIT"
          test "$(git -C /tmp/lcd-kb rev-parse HEAD)" = "$LCD_COMMIT"
          python -m pip install --no-deps -e /tmp/lcd-kb
      - name: Fetch complete public institutional-page surface and build trusted LCD run
        run: |
          cd /tmp/lcd-kb
          rm -rf data/lcd/raw/pages data/lcd/raw/posts data/lcd/reports
          PYTHONPATH=src python -m lcd_kb.cli fetch --entity page --base-url "$LIVE_BASE_URL" --per-page 100
          mkdir -p data/lcd/raw/posts
          RUN_ID="kx_live_lcd_pages_$(date -u +%Y%m%dT%H%M%SZ)"
          PYTHONPATH=src python -m lcd_kb.cli build --run-id "$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Verify live provenance and materialize bounded source receipt
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          repo = Path('/tmp/lcd-kb')
          run_id = os.environ['RUN_ID']
          lcd_commit = os.environ['LCD_COMMIT']
          base_url = os.environ['LIVE_BASE_URL']
          root = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['EXPERIENCE_ROOT']
          source_dir = root / 'source'
          source_dir.mkdir(parents=True, exist_ok=True)

          page_fetch = json.loads((repo / 'data/lcd/reports/page_fetch_summary.json').read_text())
          latest = json.loads((repo / 'data/lcd/registry/latest_trusted.json').read_text())
          run_dir = repo / 'data/lcd/runs' / run_id
          manifest = json.loads((run_dir / 'registry/run_manifest.json').read_text())
          status = json.loads((run_dir / 'registry/run_status.json').read_text())
          index_path = run_dir / 'indexes/title_slug_index.json'
          index = json.loads(index_path.read_text())

          assert page_fetch['base_url'] == base_url
          assert page_fetch['error_count'] == 0
          assert page_fetch['max_pages'] is None
          assert page_fetch['bounded_warning'] is False
          assert page_fetch['records_fetched'] >= 5
          assert latest['run_id'] == run_id
          assert latest['status'] == 'completed_trusted'
          assert manifest['run_id'] == run_id
          assert manifest['result'] == 'pass'
          assert manifest['run_status'] == 'completed_trusted'
          assert manifest['trust_level'] == 'trusted'
          assert manifest['entity_counts']['page'] == page_fetch['records_fetched']
          assert manifest['entity_counts']['post'] == 0
          assert status['run_id'] == run_id
          assert status['status'] == 'completed_trusted'
          assert len(index) == page_fetch['records_fetched']
          assert all(row['entity_type'] == 'page' for row in index)
          assert all(str(row['source_url']).startswith(base_url + '/') for row in index)

          shutil.copyfile(index_path, source_dir / 'title_slug_index.json')
          index_bytes = (source_dir / 'title_slug_index.json').read_bytes()
          receipt = {
              'schema_id': 'knowledge.real-source-receipt',
              'schema_version': 1,
              'producer': 'repo.lcd-uba-knowledgebase',
              'producer_git_commit': lcd_commit,
              'producer_run_id': run_id,
              'producer_run_status': manifest['run_status'],
              'producer_trust_level': manifest['trust_level'],
              'source_system': 'wordpress_rest',
              'source_base_url': base_url,
              'source_scope': 'complete public WordPress page collection at producer run time',
              'excluded_surface': 'posts are outside this first institutional-pages experience; bootstrap live probes returned HTTP 500 from /wp-json/wp/v2/posts',
              'page_records_fetched': page_fetch['records_fetched'],
              'index_records': len(index),
              'index_sha256': hashlib.sha256(index_bytes).hexdigest(),
              'producer_started_at': manifest['started_at'],
              'producer_completed_at': manifest['completed_at'],
              'copy_scope': 'public browsing index only; normalized page bodies and chunks are not copied into Knowledge Experiences',
          }
          (source_dir / 'producer-receipt.json').write_text(json.dumps(receipt, indent=2, ensure_ascii=False, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, ensure_ascii=False))
          PY
      - name: Compose deterministic real-source experience
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['EXPERIENCE_ROOT'])
          receipt = json.loads((root / 'source/producer-receipt.json').read_text())
          release_id = f"run:{receipt['producer_run_id']};git:{receipt['producer_git_commit']}"
          collection = {
              'schema_id': 'knowledge.collection-spec',
              'schema_version': 1,
              'collection_id': 'lcd-institutional-live',
              'title': 'LCD — institutional pages',
              'description': 'Live public institutional pages from LCD, frozen from one trusted producer run.',
              'source': {
                  'adapter': 'lcd-title-slug-index',
                  'path': 'source/title_slug_index.json',
                  'authority': 'repo.lcd-uba-knowledgebase',
                  'release_id': release_id,
              },
              'selection': {'mode': 'all'},
          }
          experience = {
              'schema_id': 'knowledge.experience-spec',
              'schema_version': 1,
              'experience_id': 'lcd-institutional-live',
              'title': 'LCD — institutional pages',
              'collection_spec': 'lcd.collection.json',
              'renderer': 'static-navigator',
              'visibility': 'public',
              'capabilities': {'search': True, 'facets': ['entity_type']},
              'navigation': {'default_sort': 'title'},
          }
          (root / 'lcd.collection.json').write_text(json.dumps(collection, indent=2, ensure_ascii=False) + '\n')
          (root / 'lcd.experience.json').write_text(json.dumps(experience, indent=2, ensure_ascii=False) + '\n')
          PY
          rm -rf "$EXPERIENCE_ROOT/release"
          kx doctor "$EXPERIENCE_ROOT/lcd.experience.json"
          kx build "$EXPERIENCE_ROOT/lcd.experience.json" --out "$EXPERIENCE_ROOT/release"
      - name: Record real-use proof and verify human artifact
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['EXPERIENCE_ROOT'])
          receipt = json.loads((root / 'source/producer-receipt.json').read_text())
          collection = json.loads((root / 'release/collection.release.json').read_text())
          experience = json.loads((root / 'release/experience.release.json').read_text())
          html = (root / 'release/site/index.html').read_text()
          source = json.loads((root / 'source/title_slug_index.json').read_text())
          assert collection['source']['release_id'] == f"run:{receipt['producer_run_id']};git:{receipt['producer_git_commit']}"
          assert collection['source']['sha256'] == receipt['index_sha256']
          assert len(collection['items']) == receipt['index_records'] == len(source)
          assert 'Plan de estudios' in html or 'Materias' in html
          assert 'lcd.exactas.uba.ar' in html
          proof = {
              'schema_id': 'knowledge.real-experience-proof',
              'schema_version': 1,
              'experience_id': 'lcd-institutional-live',
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'knowledge_experiences_commit': os.environ['GITHUB_SHA'],
              'producer_git_commit': receipt['producer_git_commit'],
              'producer_run_id': receipt['producer_run_id'],
              'collection_release_id': collection['release_id'],
              'experience_release_id': experience['release_id'],
              'rendered_artifact': 'release/site/index.html',
              'rendered_artifact_sha256': hashlib.sha256((root / 'release/site/index.html').read_bytes()).hexdigest(),
              'records': len(source),
              'result': 'pass',
          }
          (root / 'real-use-proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          print(json.dumps(proof, indent=2))
          PY
      - name: Commit immutable real-use evidence to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXPERIENCE_ROOT"
          git commit -m 'Materialize live LCD institutional pages' || exit 0
          git push origin HEAD:real-use/lcd-live-institutional
