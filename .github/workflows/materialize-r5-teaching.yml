name: Materialize R5 teaching exercise experience

on:
  push:
    branches: [real-use/r5-teaching-exercise-catalog]
    paths:
      - '.github/workflows/materialize-r5-teaching.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/r5-teaching-exercise-catalog
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Knowledge Experiences
        run: python -m pip install --no-deps -e .
      - name: Checkout exact repaired teaching producer
        run: |
          git clone -q https://github.com/matuteiglesias/ldd-uba.git /tmp/ldd-uba
          git -C /tmp/ldd-uba checkout -q 1e8a3c400e1296055614e0dec627f7177c730537
          test "$(git -C /tmp/ldd-uba rev-parse HEAD)" = "1e8a3c400e1296055614e0dec627f7177c730537"
      - name: Materialize exact numbered exercise collection
        run: |
          python scripts/materialize_markdown_collection.py \
            --repo-root /tmp/ldd-uba \
            --source-repo matuteiglesias/ldd-uba \
            --authority repo.ldd-uba \
            --commit 1e8a3c400e1296055614e0dec627f7177c730537 \
            --scope-root content/notebooks \
            --path-regex 'content/notebooks/[0-9]{2}\.md' \
            --mode all-markdown \
            --collection-id ldd-uba-exercise-catalog \
            --title 'LDD UBA — frozen teaching exercise catalog' \
            --description 'Metadata-only index of the exact 60 numbered teaching exercise pages; repo.ldd-uba retains pedagogical content and Hugo navigation authority.' \
            --kind teaching-exercise \
            --out-dir experiences/real/ldd-uba-exercise-catalog

          cat > experiences/real/ldd-uba-exercise-catalog/snapshot.experience.json <<'JSON'
          {
            "schema_id": "knowledge.experience-spec",
            "schema_version": 1,
            "experience_id": "ldd-uba-frozen-exercise-catalog",
            "title": "LDD UBA — frozen teaching exercise catalog",
            "collection_spec": "collection.json",
            "renderer": "static-navigator",
            "visibility": "public",
            "capabilities": {
              "search": true,
              "facets": []
            },
            "navigation": {
              "default_sort": "title"
            }
          }
          JSON
      - name: Build deterministic E2 artifact
        run: |
          kx validate experiences/real/ldd-uba-exercise-catalog/collection.json
          kx doctor experiences/real/ldd-uba-exercise-catalog/snapshot.experience.json
          kx build experiences/real/ldd-uba-exercise-catalog/snapshot.experience.json --out experiences/real/ldd-uba-exercise-catalog/release
      - name: Prove persistent-capable real-source seam
        run: |
          python scripts/prove_git_vertical_seams.py \
            --ldd-root /tmp/ldd-uba \
            --write-proofs
      - name: Append governed census case
        run: python scripts/promote_r5_teaching.py
      - name: Validate repository
        run: |
          python -m py_compile scripts/prove_git_vertical_seams.py
          make check
      - name: Remove one-shot R5 machinery
        run: |
          rm .github/workflows/materialize-r5-teaching.yml
          rm scripts/promote_r5_teaching.py
      - name: Commit governed R5 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R5: add real teaching exercise E3 experience'
          git push origin HEAD:real-use/r5-teaching-exercise-catalog
