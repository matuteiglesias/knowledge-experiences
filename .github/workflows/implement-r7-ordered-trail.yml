name: Implement R7 evidence-pulled ordered trail

on:
  push:
    branches: [real-use/r7-ordered-thesis-trail]
    paths:
      - '.github/workflows/implement-r7-ordered-trail.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      THESIS_COMMIT: 7265018750db0f96b69efd4048aedad06ad803fc
      TRAIL_ROOT: experiences/real/economic-complexity-reading-path
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/r7-ordered-thesis-trail
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add only the ordering semantics demanded by the real trail
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one patch target, found {text.count(old)}')
              p.write_text(text.replace(old, new))

          replace(
              'src/knowledge_experiences/models.py',
              '        if mode not in {"all", "ids", "facets"}:\n            raise ValidationError("selection.mode must be \'all\', \'ids\', or \'facets\'")',
              '        if mode not in {"all", "ids", "ordered_ids", "facets"}:\n            raise ValidationError("selection.mode must be \'all\', \'ids\', \'ordered_ids\', or \'facets\'")',
          )
          replace(
              'src/knowledge_experiences/models.py',
              '        if mode == "ids" and not ids:\n            raise ValidationError("selection.item_ids must be non-empty when mode=\'ids\'")\n        if mode != "ids" and ids:\n            raise ValidationError("selection.item_ids is only valid when mode=\'ids\'")',
              '        if mode in {"ids", "ordered_ids"} and not ids:\n            raise ValidationError("selection.item_ids must be non-empty when mode is \'ids\' or \'ordered_ids\'")\n        if mode not in {"ids", "ordered_ids"} and ids:\n            raise ValidationError("selection.item_ids is only valid when mode is \'ids\' or \'ordered_ids\'")',
          )
          replace(
              'src/knowledge_experiences/models.py',
              '        if self.mode == "ids":\n            out["item_ids"] = list(self.item_ids)',
              '        if self.mode in {"ids", "ordered_ids"}:\n            out["item_ids"] = list(self.item_ids)',
          )
          replace(
              'src/knowledge_experiences/models.py',
              '        if default_sort not in {"title", "date", "source"}:\n            raise ValidationError("navigation.default_sort must be title, date, or source")',
              '        if default_sort not in {"title", "date", "source", "curated"}:\n            raise ValidationError("navigation.default_sort must be title, date, source, or curated")',
          )

          replace(
              'src/knowledge_experiences/compiler.py',
              '    elif spec.selection.mode == "ids":',
              '    elif spec.selection.mode in {"ids", "ordered_ids"}:',
          )
          replace(
              'src/knowledge_experiences/compiler.py',
              '    return sorted(selected, key=lambda item: item["item_id"])',
              '    if spec.selection.mode == "ordered_ids":\n        return selected\n    return sorted(selected, key=lambda item: item["item_id"])',
          )

          replace(
              'src/knowledge_experiences/renderers.py',
              '<option value="source">Source</option>\n</select>',
              '<option value="source">Source</option>\n<option value="curated">Curated order</option>\n</select>',
          )
          replace(
              'src/knowledge_experiences/renderers.py',
              'function sorted(items){\n  return [...items].sort((a,b)=>{',
              'function sorted(items){\n  if(state.sort==="curated") return [...items];\n  return [...items].sort((a,b)=>{',
          )

          p = Path('contracts/collection.spec.v1.schema.json')
          data = json.loads(p.read_text())
          data['properties']['selection']['properties']['mode']['enum'] = ['all', 'ids', 'ordered_ids', 'facets']
          p.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('contracts/experience.spec.v1.schema.json')
          data = json.loads(p.read_text())
          data['properties']['navigation']['properties']['default_sort']['enum'] = ['title', 'date', 'source', 'curated']
          p.write_text(json.dumps(data, indent=2) + '\n')

          test = Path('tests/test_kernel.py')
          text = test.read_text()
          marker = '    def test_missing_selected_id_fails_closed(self) -> None:\n'
          addition = '''    def test_ordered_id_selection_preserves_declared_sequence(self) -> None:\n        raw = json.loads((FIXTURE / "demo.collection.json").read_text(encoding="utf-8"))\n        raw["selection"] = {"mode": "ordered_ids", "item_ids": ["demo:3", "demo:1"]}\n        with tempfile.TemporaryDirectory() as td:\n            td = Path(td)\n            (td / "items.jsonl").write_bytes((FIXTURE / "items.jsonl").read_bytes())\n            spec_path = td / "collection.json"\n            spec_path.write_text(json.dumps(raw), encoding="utf-8")\n            release = compile_collection(spec_path)\n            self.assertEqual([item["item_id"] for item in release["items"]], ["demo:3", "demo:1"])\n\n    def test_curated_navigation_preserves_collection_order(self) -> None:\n        collection = json.loads((FIXTURE / "demo.collection.json").read_text(encoding="utf-8"))\n        collection["selection"] = {"mode": "ordered_ids", "item_ids": ["demo:3", "demo:1"]}\n        experience = json.loads((FIXTURE / "demo.experience.json").read_text(encoding="utf-8"))\n        experience["collection_spec"] = "collection.json"\n        experience["navigation"] = {"default_sort": "curated"}\n        with tempfile.TemporaryDirectory() as td:\n            td = Path(td)\n            (td / "items.jsonl").write_bytes((FIXTURE / "items.jsonl").read_bytes())\n            (td / "collection.json").write_text(json.dumps(collection), encoding="utf-8")\n            (td / "experience.json").write_text(json.dumps(experience), encoding="utf-8")\n            out = td / "release"\n            build_experience(td / "experience.json", out)\n            release = json.loads((out / "collection.release.json").read_text(encoding="utf-8"))\n            self.assertEqual([item["item_id"] for item in release["items"]], ["demo:3", "demo:1"])\n            html = (out / "site" / "index.html").read_text(encoding="utf-8")\n            self.assertIn('"default_sort":"curated"', html)\n            self.assertLess(html.index('demo:3'), html.index('demo:1'))\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          test.write_text(text.replace(marker, addition + marker))
          PY

      - name: Install patched Knowledge Experiences
        run: python -m pip install --no-deps -e .

      - name: Checkout exact Thesis producer and reproduce accepted full projection
        run: |
          git clone -q https://github.com/matuteiglesias/thesis.git /tmp/thesis
          git -C /tmp/thesis checkout -q "$THESIS_COMMIT"
          test "$(git -C /tmp/thesis rev-parse HEAD)" = "$THESIS_COMMIT"
          python scripts/materialize_markdown_collection.py \
            --repo-root /tmp/thesis \
            --source-repo matuteiglesias/thesis \
            --authority repo.thesis \
            --commit "$THESIS_COMMIT" \
            --scope-root docs \
            --mode all-markdown \
            --collection-id economics-of-aggregation-programme \
            --title 'Economics of Aggregation programme — exact document index' \
            --description 'Metadata-only index of exact versioned research-programme documents; repo.thesis retains content and status authority.' \
            --kind research-document \
            --out-dir /tmp/thesis-full
          cmp /tmp/thesis-full/source/items.jsonl experiences/real/economics-of-aggregation-programme/source/items.jsonl

      - name: Resolve producer-curated Trail B and materialize ordered experience
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          root = Path(os.environ['TRAIL_ROOT'])
          root.mkdir(parents=True, exist_ok=True)
          thesis = Path('/tmp/thesis')
          commit = os.environ['THESIS_COMMIT']
          slugs = [
              'observations-lq-problem',
              'lq-misleads',
              'weighted-multi-product-lq',
              'designing-plq',
              'measurement-robustness',
              'selection-diagnostics',
          ]
          intro = (thesis / 'docs/intro.md').read_text(encoding='utf-8')
          positions = []
          for slug in slugs:
              token = f'(./{slug})'
              pos = intro.find(token)
              if pos < 0:
                  raise SystemExit(f'Trail B link missing from producer intro: {token}')
              positions.append(pos)
          if positions != sorted(positions) or len(set(positions)) != len(positions):
              raise SystemExit('producer Trail B link order is not the expected six-step sequence')

          slug_paths = {}
          for path in sorted((thesis / 'docs').rglob('*.md')):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'(?m)^slug:\s*/([^\s]+)\s*$', text)
              if match and match.group(1) in slugs:
                  slug = match.group(1)
                  if slug in slug_paths:
                      raise SystemExit(f'duplicate producer slug: {slug}')
                  slug_paths[slug] = path.relative_to(thesis).as_posix()
          missing = [slug for slug in slugs if slug not in slug_paths]
          if missing:
              raise SystemExit(f'producer Trail B slugs do not resolve to exact Markdown files: {missing}')

          rows = [json.loads(line) for line in Path('/tmp/thesis-full/source/items.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          by_path = {row['source_ref']['object_id']: row for row in rows}
          ordered_paths = [slug_paths[slug] for slug in slugs]
          missing_paths = [path for path in ordered_paths if path not in by_path]
          if missing_paths:
              raise SystemExit(f'Trail B paths missing from accepted Thesis projection: {missing_paths}')
          ordered_ids = [by_path[path]['item_id'] for path in ordered_paths]

          collection = {
              'schema_id': 'knowledge.collection-spec',
              'schema_version': 1,
              'collection_id': 'economic-complexity-reading-path',
              'title': 'Economic complexity — location-quotient problem reading path',
              'description': 'Six-step producer-curated Trail B from the exact Thesis research programme, preserving editorial sequence as collection meaning.',
              'source': {
                  'adapter': 'jsonl',
                  'path': '../economics-of-aggregation-programme/source/items.jsonl',
                  'authority': 'repo.thesis',
                  'release_id': f'git:{commit}',
              },
              'selection': {'mode': 'ordered_ids', 'item_ids': ordered_ids},
          }
          experience = {
              'schema_id': 'knowledge.experience-spec',
              'schema_version': 1,
              'experience_id': 'economic-complexity-reading-path',
              'title': 'Understand the location-quotient problem',
              'collection_spec': 'collection.json',
              'renderer': 'static-navigator',
              'visibility': 'public',
              'capabilities': {'search': True, 'facets': []},
              'navigation': {'default_sort': 'curated'},
          }
          (root / 'collection.json').write_text(json.dumps(collection, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          (root / 'snapshot.experience.json').write_text(json.dumps(experience, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          receipt = {
              'schema_id': 'knowledge.curated-trail-source-receipt',
              'schema_version': 1,
              'producer': 'repo.thesis',
              'producer_git_commit': commit,
              'producer_authority_document': 'docs/intro.md#Trail-B',
              'trail_label': 'Understand the location-quotient problem',
              'ordered_slugs': slugs,
              'ordered_source_paths': ordered_paths,
              'ordered_item_ids': ordered_ids,
              'source_projection': 'experiences/real/economics-of-aggregation-programme/source/items.jsonl',
              'ordering_semantics': 'producer editorial sequence; not alphabetical or item-id sort',
          }
          (root / 'source-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY
          rm -rf "$TRAIL_ROOT/release"
          kx doctor "$TRAIL_ROOT/snapshot.experience.json"
          kx build "$TRAIL_ROOT/snapshot.experience.json" --out "$TRAIL_ROOT/release"

      - name: Assert order survives release and renderer and write E3 proof
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['TRAIL_ROOT'])
          receipt = json.loads((root / 'source-receipt.json').read_text())
          collection = json.loads((root / 'release/collection.release.json').read_text())
          experience = json.loads((root / 'release/experience.release.json').read_text())
          actual_ids = [row['item_id'] for row in collection['items']]
          if actual_ids != receipt['ordered_item_ids']:
              raise SystemExit(f'curated order lost in CollectionRelease: {actual_ids}')
          html_path = root / 'release/site/index.html'
          html = html_path.read_text(encoding='utf-8')
          positions = [html.find(item_id) for item_id in actual_ids]
          if any(pos < 0 for pos in positions) or positions != sorted(positions):
              raise SystemExit('curated item order lost in rendered HTML payload')
          proof = {
              'schema_id': 'knowledge.e3-cross-repo-proof',
              'schema_version': 1,
              'proof': 'producer-curated-order-to-frozen-experience',
              'source_repo': 'matuteiglesias/thesis',
              'source_commit': os.environ['THESIS_COMMIT'],
              'producer_authority_document': 'docs/intro.md#Trail-B',
              'ordered_item_ids': actual_ids,
              'collection_release_id': collection['release_id'],
              'experience_release_id': experience['release_id'],
              'rendered_artifact_sha256': hashlib.sha256(html_path.read_bytes()).hexdigest(),
              'result': 'pass',
          }
          (root / 'e3-proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(proof, indent=2))
          PY

      - name: Add persistent exact-source ordered-trail proof
        run: |
          cat > scripts/prove_ordered_thesis_trail.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, hashlib, json, re, shutil, subprocess, tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          COMMIT = '7265018750db0f96b69efd4048aedad06ad803fc'
          SLUGS = [
              'observations-lq-problem', 'lq-misleads', 'weighted-multi-product-lq',
              'designing-plq', 'measurement-robustness', 'selection-diagnostics',
          ]

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def run(*args: str) -> None:
              subprocess.run(list(args), check=True)

          def same(a: Path, b: Path, label: str) -> None:
              if sha(a) != sha(b):
                  raise SystemExit(f'{label}: sha mismatch {sha(a)} != {sha(b)}')

          def resolve(root: Path) -> list[str]:
              actual = subprocess.run(['git','-C',str(root),'rev-parse','HEAD'], check=True, text=True, capture_output=True).stdout.strip()
              if actual != COMMIT:
                  raise SystemExit(f'thesis checkout mismatch: {actual} != {COMMIT}')
              intro = (root / 'docs/intro.md').read_text(encoding='utf-8')
              positions = [intro.find(f'(./{slug})') for slug in SLUGS]
              if any(p < 0 for p in positions) or positions != sorted(positions):
                  raise SystemExit('producer Trail B links missing or reordered')
              mapping = {}
              for path in sorted((root / 'docs').rglob('*.md')):
                  text = path.read_text(encoding='utf-8')
                  match = re.search(r'(?m)^slug:\s*/([^\s]+)\s*$', text)
                  if match and match.group(1) in SLUGS:
                      if match.group(1) in mapping:
                          raise SystemExit(f'duplicate slug {match.group(1)}')
                      mapping[match.group(1)] = path.relative_to(root).as_posix()
              missing = [slug for slug in SLUGS if slug not in mapping]
              if missing:
                  raise SystemExit(f'unresolved Trail B slugs: {missing}')
              return [mapping[slug] for slug in SLUGS]

          def main() -> int:
              ap = argparse.ArgumentParser()
              ap.add_argument('--thesis-root', required=True)
              args = ap.parse_args()
              source_root = Path(args.thesis_root).resolve()
              ordered_paths = resolve(source_root)
              accepted_full = ROOT / 'experiences/real/economics-of-aggregation-programme'
              accepted_trail = ROOT / 'experiences/real/economic-complexity-reading-path'
              receipt = json.loads((accepted_trail / 'source-receipt.json').read_text())
              if receipt['ordered_source_paths'] != ordered_paths:
                  raise SystemExit('accepted trail source paths no longer equal producer Trail B')

              with tempfile.TemporaryDirectory(prefix='kx-r7-trail-') as td_raw:
                  td = Path(td_raw)
                  full = td / 'experiences/real/economics-of-aggregation-programme'
                  run(
                      'python', str(ROOT / 'scripts/materialize_markdown_collection.py'),
                      '--repo-root', str(source_root), '--source-repo', 'matuteiglesias/thesis',
                      '--authority', 'repo.thesis', '--commit', COMMIT, '--scope-root', 'docs',
                      '--mode', 'all-markdown', '--collection-id', 'economics-of-aggregation-programme',
                      '--title', 'Economics of Aggregation programme — exact document index',
                      '--description', 'Metadata-only index of exact versioned research-programme documents; repo.thesis retains content and status authority.',
                      '--kind', 'research-document', '--out-dir', str(full),
                  )
                  same(full / 'source/items.jsonl', accepted_full / 'source/items.jsonl', 'Thesis source projection')
                  trail = td / 'experiences/real/economic-complexity-reading-path'
                  trail.mkdir(parents=True)
                  shutil.copy2(accepted_trail / 'collection.json', trail / 'collection.json')
                  shutil.copy2(accepted_trail / 'snapshot.experience.json', trail / 'snapshot.experience.json')
                  rows = [json.loads(line) for line in (full / 'source/items.jsonl').read_text().splitlines() if line.strip()]
                  by_path = {row['source_ref']['object_id']: row['item_id'] for row in rows}
                  expected_ids = [by_path[path] for path in ordered_paths]
                  spec = json.loads((trail / 'collection.json').read_text())
                  if spec['selection'] != {'mode': 'ordered_ids', 'item_ids': expected_ids}:
                      raise SystemExit('accepted ordered selection does not match producer Trail B')
                  run('kx', 'doctor', str(trail / 'snapshot.experience.json'))
                  run('kx', 'build', str(trail / 'snapshot.experience.json'), '--out', str(trail / 'release'))
                  same(trail / 'release/collection.release.json', accepted_trail / 'release/collection.release.json', 'trail collection release')
                  same(trail / 'release/experience.release.json', accepted_trail / 'release/experience.release.json', 'trail experience release')
                  same(trail / 'release/site/index.html', accepted_trail / 'release/site/index.html', 'trail rendered artifact')
              print(json.dumps({'case':'economic-complexity-reading-path','source_commit':COMMIT,'ordered_steps':len(SLUGS),'result':'pass'}, indent=2))
              return 0

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          chmod +x scripts/prove_ordered_thesis_trail.py
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/git-vertical-seam-proof.yml')
          text = p.read_text()
          text = text.replace("      - 'experiences/real/economics-of-aggregation-programme/**'\n", "      - 'experiences/real/economics-of-aggregation-programme/**'\n      - 'experiences/real/economic-complexity-reading-path/**'\n")
          needle = '''          python scripts/prove_git_vertical_seams.py \\\n            --thesis-root /tmp/thesis \\\n            --journal-root /tmp/journal \\\n            --ldd-root /tmp/ldd-uba\n'''
          replacement = needle + "          python scripts/prove_ordered_thesis_trail.py --thesis-root /tmp/thesis\n"
          if text.count(needle) != 1:
              raise SystemExit('git vertical workflow command marker missing')
          p.write_text(text.replace(needle, replacement))
          PY
          python scripts/prove_ordered_thesis_trail.py --thesis-root /tmp/thesis

      - name: Promote census #5 only after the real ordered trail is proven
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter
          from pathlib import Path
          root = Path('experiences/real/economic-complexity-reading-path')
          receipt = json.loads((root/'source-receipt.json').read_text())
          collection = json.loads((root/'release/collection.release.json').read_text())
          experience = json.loads((root/'release/experience.release.json').read_text())
          proof = json.loads((root/'e3-proof.json').read_text())

          p = Path('docs/experience-census.v1.json')
          census = json.loads(p.read_text())
          row = next(r for r in census['experiences'] if r['id'] == 5)
          if row['experience_id'] != 'economic-complexity-reading-path' or row['composition_maturity'] != 'E0':
              raise SystemExit('R7 expects census #5 at its accepted E0 frontier')
          row.update({
              'composition_maturity': 'E3',
              'engineering_status': 'proven_real_source_seam',
              'existing_surface': 'repo.thesis producer-curated Trail B in docs/intro.md',
              'source_authorities': ['repo.thesis', 'human-curation'],
              'code_pins': {'repo.thesis': receipt['producer_git_commit']},
              'exact_source_release': f"git:{receipt['producer_git_commit']};authority:docs/intro.md#Trail-B",
              'collection_release': f"experiences/real/economic-complexity-reading-path/release/collection.release.json#{collection['release_id']}",
              'renderer_profile': 'curated-static-navigator',
              'rendered_artifact': 'experiences/real/economic-complexity-reading-path/release/site/index.html',
              'cross_repo_proof': 'experiences/real/economic-complexity-reading-path/e3-proof.json + scripts/prove_ordered_thesis_trail.py + .github/workflows/git-vertical-seam-proof.yml',
              'operational_evidence': None,
              'capabilities_reused': ['git-markdown-metadata-projection','ordered-ids-selection','curated-order-rendering','static-navigator','exact-git-cross-repo-proof'],
              'incremental_work': 'small V2 capability only: ordered_ids preserves curator-declared membership sequence and curated renderer order preserves it in the human artifact',
              'blocker': 'none for this six-step ordered trail; grouped/module semantics remain unimplemented until a real grouped reading experience requires them',
              'observed_friction': 'V1 ids selection canonicalized by item_id and the renderer re-sorted items, destroying the producer editorial sequence; the real Thesis Trail B made order demonstrably semantic',
              'v2_candidate': None,
              'engineering_evidence': [
                  'repo.thesis docs/intro.md declares Trail B as a six-step reading sequence at the exact pinned commit',
                  f"ordered CollectionRelease {collection['release_id']} preserves all six producer-resolved IDs in declared sequence",
                  f"ExperienceRelease {experience['release_id']} and artifact {proof['rendered_artifact_sha256']} preserve curated order through the static navigator",
                  'persistent exact-source proof re-resolves producer slugs, reproduces the 89-document parent projection and rebuilds the accepted ordered trail',
              ],
              'evidence_boundary': 'E3 proves the exact six-step Thesis Trail B sequence through the KX ordered-selection seam; it does not claim pedagogical grouping, Paper KB paper semantics, recurring use, deployment, or E4 operation',
              'next_real_action': 'use/circulate the ordered trail or test a genuinely grouped course-reading source; implement groups only if a real grouped case cannot be represented by ordered_ids alone',
          })
          counts = Counter(r['composition_maturity'] for r in census['experiences'])
          expected = Counter({'E4':1,'E3':5,'E1':1,'E0':9})
          if counts != expected:
              raise SystemExit(f'unexpected R7 maturity distribution: {counts}')
          p.write_text(json.dumps(census, indent=2, ensure_ascii=False) + '\n')

          p = Path('SYSTEM.yaml')
          text = p.read_text()
          text = text.replace('    E4: 1\n    E3: 4\n    E1: 1\n    E0: 10\n', '    E4: 1\n    E3: 5\n    E1: 1\n    E0: 9\n')
          text = text.replace('    - ordered-groups-and-reading-trails\n', '    - grouped-reading-semantics-if-real-demand\n')
          text = text.replace('  phase: first-operational-experience\n  next_gate: paper-real-corpus-or-independent-operational-use\n', '  phase: first-operational-plus-evidence-pulled-v2\n  next_gate: paper-real-corpus-or-real-grouped-or-multi-source-pressure\n')
          p.write_text(text)

          p = Path('docs/EXPERIENCE_CENSUS.md')
          text = p.read_text()
          text = re.sub(r'\*\*16 governed experiences:[^\n]+\*\*[^\n]*', '**16 governed experiences: 1 is E4, 5 are E3, 1 is E1, and 9 remain E0.** R7 promotes the previously blocked economic-complexity reading path only after a real producer-curated trail proved that sequence is semantic.', text, count=1)
          text = re.sub(r'\| 5 \| Economic-complexity reading path \| \*\*E0\*\* \| blocked_capability \|[^\n]*', f"| 5 | Economic-complexity reading path | **E3** | proven_real_source_seam | six exact Thesis Trail B steps → `{experience['release_id']}` with producer order preserved |", text, count=1)
          text += '''\n## R7 interpretation\n\nThe first V2 capability was earned by a real representational failure rather than census speculation. `repo.thesis` already declares Trail B as a six-step editorial sequence. V1 could select the six IDs but canonicalized them by `item_id`, and the static navigator sorted again, erasing the intended reading path. R7 adds only `ordered_ids` plus `curated` navigation. Grouping remains deliberately absent.\n\nA second genuine E4 was **not** claimed in R7: no other E3 showed an independent operational event.\n'''
          p.write_text(text)

          p = Path('docs/BUILD_BUNDLE.md')
          text = p.read_text()
          text += '''\n## R6–R7 frontier extension\n\n- **R6 — first E4:** LCD institutional browsing completed a second governed live refresh, source comparison, deterministic rebuild and downstream subset validation. The dependent subset remained E3 because it lacked independent operational demand.\n- **R7 — first evidence-pulled V2:** a real six-step Thesis Trail B proved that curator order is semantic. KX added only `ordered_ids` selection and `curated` navigation, then promoted census #5 to E3 through persistent exact-source proof. Group/module semantics remain parked until a real grouped case requires them.\n\nCurrent live census after R7: **1×E4 + 5×E3 + 1×E1 + 9×E0**. The next high-value scientific gate remains a real Paper KB corpus; the remaining V2 frontier is now narrower: genuine grouped pedagogy or multi-source/curation pressure.\n'''
          p.write_text(text)
          PY

      - name: Validate R7 and all local invariants
        run: |
          python -m py_compile scripts/prove_ordered_thesis_trail.py
          make check
          python scripts/prove_ordered_thesis_trail.py --thesis-root /tmp/thesis

