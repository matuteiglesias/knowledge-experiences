name: Promote LCD real-use evidence

on:
  push:
    branches: [real-use/lcd-live-institutional]
    paths:
      - '.github/workflows/promote-lcd-real-use.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/lcd-live-institutional
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote evidence into governed census
        run: python scripts/promote_lcd_real_use.py
      - name: Validate promoted repository state
        run: make check
      - name: Remove one-shot bootstrap workflows
        run: |
          rm .github/workflows/materialize-lcd-live.yml
          rm .github/workflows/materialize-lcd-thesis-subset.yml
          rm .github/workflows/promote-lcd-real-use.yml
      - name: Commit governed real-use promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote first real LCD experiences to E3'
          git push origin HEAD:real-use/lcd-live-institutional
